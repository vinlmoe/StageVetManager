# Désactive la compilation incrémentale Kotlin pour éviter les ClassNotFoundException
# après un git pull (les caches de compilation Kotlin deviennent incohérents).
kotlin.incremental=false

# Augmente la mémoire pour la compilation Kotlin + Compose
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m

# Un seul démon Gradle à la fois (évite les conflits "multiple Kotlin daemon sessions")
org.gradle.daemon=true
org.gradle.parallel=false
